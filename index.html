<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dandy's World Education</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Kalau punya font Pixeloid Sans asli, upload sebagai PixeloidSans.ttf, otomatis dipakai untuk teks Vee */
  @font-face {
    font-family: "Pixeloid Sans";
    src: local("Pixeloid Sans"), url("PixeloidSans.ttf") format("truetype");
    font-display: swap;
  }
  :root {
    --panel: rgba(24, 20, 58, .78);
    --ink: #111111;
    --sun: #ffd23f;
    --white: #ffffff;
    --shadow: #0d0b26;
    --coral: #ff5a5f;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { height: 100%; }
  body {
    margin: 0; min-height: 100%;
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    background: #14102e url("bg.webp") center / cover no-repeat fixed;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background: linear-gradient(rgba(10,8,30,.25), rgba(10,8,30,.55));
    pointer-events: none;
  }
  /* Background poster kuis (soal & hasil) */
  body.quiz {
    background: #0f2415 url("quiz_bg.jpg") center / cover no-repeat fixed;
  }
  body.quiz::before { background: rgba(0,0,0,.12); }
  @media (min-aspect-ratio: 7/10) {
    body.quiz { background-size: auto 100%; }
  }

  .frame {
    position: relative;
    width: 100%; max-width: 760px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 6px solid var(--ink);
    outline: 3px solid rgba(255,255,255,.35);
    border-radius: 28px;
    box-shadow: 0 10px 0 var(--shadow);
    padding: 24px 22px;
    display: flex; flex-direction: column; align-items: center;
  }
  body.quiz .frame { background: rgba(8, 30, 16, .86); }
  .screen { display: none; width: 100%; flex-direction: column; align-items: center; }
  .screen.active { display: flex; }

  /* ===== Judul ===== */
  .title { margin: 0; display: flex; flex-direction: column; align-items: center; width: 100%; }
  .logo { width: clamp(240px, 62vw, 400px); height: auto; display: block; }
  .edu { width: clamp(230px, 58vw, 380px); height: auto; display: block; margin-top: -2px; overflow: visible; }

  /* ===== Karakter + kotak dialog ===== */
  .stage {
    width: 100%; display: flex; align-items: center; justify-content: center;
    gap: 18px; padding: 18px 0 20px;
  }
  .teacher { flex: none; display: grid; place-items: center; }
  .teacher img {
    height: clamp(120px, 24vh, 180px); width: auto; max-width: 42vw;
    display: block; object-fit: contain;
    filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 6px rgba(255,255,255,.55)) drop-shadow(0 4px 0 rgba(0,0,0,.35));
  }
  .teacher.bob img { animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .teacher img.framed {
    width: clamp(96px, 18vh, 130px); height: clamp(96px, 18vh, 130px);
    object-fit: cover; border: 4px solid var(--ink); border-radius: 20px; filter: none;
    box-shadow: 0 5px 0 rgba(0,0,0,.45);
  }

  .dlg { flex: 1; max-width: 440px; min-width: 0; }
  .dlg[data-char="shelly"] {
    --c1: #dcc3a2; --c2: #e8d3b6; --edge: #f0dfc8;
    --font: "Fredoka", "Trebuchet MS", sans-serif; --size: clamp(20px, 5vw, 27px);
  }
  .dlg[data-char="vee"] {
    --c1: #82d48d; --c2: #99e0a2; --edge: #b9efbf;
    --font: "Pixeloid Sans", "Pixelify Sans", "Courier New", monospace; --size: clamp(19px, 4.8vw, 25px);
  }
  .dlg[data-char="showtime"] {
    --c1: #e5483b; --c2: #f0604f; --edge: #ff9a8a;
    --font: "Fredoka", "Trebuchet MS", sans-serif; --size: clamp(20px, 5vw, 27px);
  }
  .dlg.compact[data-char="shelly"], .dlg.compact[data-char="showtime"] { --size: clamp(16px, 4.2vw, 21px); }
  .dlg.compact[data-char="vee"] { --size: clamp(15px, 3.9vw, 19px); }
  .dlg.compact .dbox { min-height: 96px; padding: 14px 16px; }
  .dlg.compact .dbox p { -webkit-text-stroke-width: 4px; }

  .dlg-name {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 8px;
    font-family: "Fredoka", sans-serif; font-weight: 700;
    font-size: clamp(24px, 6vw, 32px); color: var(--white);
    -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill;
  }
  .dlg-name img { width: 38px; height: 38px; object-fit: contain; border-radius: 8px; }
  .dbox {
    position: relative;
    min-height: 120px;
    display: grid; place-items: center;
    padding: 18px 20px;
    border: 5px solid var(--ink);
    border-radius: 18px;
    background:
      linear-gradient(rgba(255,255,255,.22), rgba(0,0,0,.14)),
      repeating-linear-gradient(-45deg, var(--c1) 0 16px, var(--c2) 16px 32px);
    box-shadow: inset 0 0 0 3px var(--edge), 0 5px 0 rgba(0,0,0,.45);
  }
  .pop { animation: pop .28s ease-out; }
  @keyframes pop { 0% { transform: scale(.85); opacity: 0; } 70% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); } }
  .dbox p {
    margin: 0; text-align: center;
    font-family: var(--font); font-weight: 700; font-size: var(--size);
    line-height: 1.3; color: var(--white);
    -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill;
    letter-spacing: .01em; word-break: break-word;
  }

  /* ===== Tombol ===== */
  .actions {
    display: grid; grid-template-columns: 64px 1fr 64px;
    align-items: end; gap: 14px;
    width: 100%; max-width: 480px;
  }
  button { font-family: inherit; cursor: pointer; color: var(--ink); }
  .btn-icon {
    width: 64px; height: 64px; border-radius: 18px;
    background: var(--white); border: 4px solid var(--ink);
    box-shadow: 0 5px 0 var(--ink);
    display: grid; place-items: center;
    transition: transform .08s, box-shadow .08s;
  }
  .btn-icon svg { width: 34px; height: 34px; }
  .btn-start {
    height: 72px; border-radius: 22px;
    background: var(--sun); border: 4px solid var(--ink);
    box-shadow: 0 7px 0 var(--ink);
    font-size: 32px; font-weight: 700; padding: 0 28px;
    transition: transform .08s, box-shadow .08s;
  }
  .btn-icon:hover, .btn-start:hover { transform: translateY(-2px); }
  .btn-icon:active, .btn-start:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  button:focus-visible { outline: 4px solid var(--coral); outline-offset: 3px; }

  .char-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .char-badge {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--white); border: 4px solid var(--ink);
    display: grid; place-items: center; overflow: hidden;
  }
  .char-badge img { width: 100%; height: 100%; object-fit: contain; padding: 3px; }
  .char-badge.cover img { object-fit: cover; padding: 0; }

  .btn-small {
    padding: 10px 22px; border-radius: 14px;
    background: var(--sun); border: 3px solid var(--ink);
    box-shadow: 0 4px 0 var(--ink);
    font-size: 18px; font-weight: 700;
  }
  .btn-small:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

  /* ===== Layar soal ===== */
  .qhead { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .pill {
    background: var(--sun); border: 3px solid var(--ink); border-radius: 999px;
    padding: 4px 16px; font-weight: 700; font-size: 18px; box-shadow: 0 3px 0 var(--ink);
  }
  .btn-menu { padding: 6px 14px; font-size: 16px; background: var(--white); }
  .qbox {
    width: 100%; padding: 18px 20px; text-align: center;
    border: 5px solid var(--ink); border-radius: 18px;
    background:
      linear-gradient(rgba(255,255,255,.25), rgba(0,0,0,.06)),
      repeating-linear-gradient(-45deg, #fffdf2 0 16px, #f2ecd2 16px 32px);
    box-shadow: 0 5px 0 rgba(0,0,0,.45);
    font-weight: 700; font-size: clamp(20px, 5.2vw, 28px); line-height: 1.25;
  }
  .opts { width: 100%; display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 14px; }
  @media (min-width: 600px) { .opts { grid-template-columns: 1fr 1fr; } }
  .opt {
    display: flex; align-items: center; gap: 12px; text-align: left;
    background: var(--white); border: 4px solid var(--ink); border-radius: 16px;
    box-shadow: 0 5px 0 var(--ink); padding: 10px 14px;
    font-size: clamp(17px, 4.4vw, 22px); font-weight: 700;
    opacity: 0; transform: translateY(10px) scale(.96); transition: opacity .25s, transform .25s, background .1s;
  }
  .opt.show { opacity: 1; transform: none; }
  .opt .ltr {
    width: 38px; height: 38px; flex: none; border-radius: 50%;
    background: var(--sun); border: 3px solid var(--ink); display: grid; place-items: center; font-size: 20px;
  }
  .opt:not(:disabled):hover { transform: translateY(-2px); }
  .opt:disabled { cursor: default; }
  .opt.picked { background: var(--sun); }
  .speaker { width: 100%; padding-top: 14px; }
  .speaker .stage { padding: 6px 0 4px; }
  .qactions { margin-top: 14px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .namerow input {
    width: min(320px, 80vw); height: 58px; padding: 0 12px; text-align: center;
    font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 26px; color: var(--ink);
    background: #fffdf2; border: 4px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 var(--ink);
  }
  .namerow input::placeholder { font-size: 17px; font-weight: 500; color: #77735f; }
  .namerow input:focus-visible { outline: 4px solid var(--coral); outline-offset: 3px; }
  .btn-start:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  /* ===== Hasil ===== */
  .result { text-align: center; color: var(--white); padding: 30px 0; }
  .result h2 { font-size: 34px; margin: 0 0 6px; }
  .result .big { font-size: 72px; font-weight: 700; color: var(--sun); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; margin: 6px 0; }
  .result p { margin: 0 0 20px; font-size: 18px; }

  /* ===== Modal setting ===== */
  .overlay {
    position: fixed; inset: 0; background: rgba(10,8,30,.75);
    display: none; align-items: center; justify-content: center;
    padding: 16px; z-index: 10;
  }
  .overlay.open { display: flex; }
  .modal {
    width: 100%; max-width: 460px; max-height: calc(100vh - 32px); overflow-y: auto;
    background: #e6f6ee; border: 5px solid var(--ink); border-radius: 24px;
    box-shadow: 0 8px 0 var(--shadow); padding: 22px;
  }
  .modal h2 { margin: 0 0 16px; font-size: 28px; }
  .modal .close-row { display: flex; justify-content: flex-end; margin-top: 18px; }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--white); border: 3px solid var(--ink); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 10px; font-size: 18px; font-weight: 500;
  }
  .toggle {
    width: 62px; height: 34px; border-radius: 999px; border: 3px solid var(--ink);
    background: #c9c9d6; position: relative; padding: 0; transition: background .15s;
  }
  .toggle::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 22px; height: 22px; border-radius: 50%; background: var(--ink);
    transition: transform .15s;
  }
  .toggle[aria-checked="true"] { background: #5ed38a; }
  .toggle[aria-checked="true"]::after { transform: translateX(28px); }

  @media (max-width: 600px) {
    .stage { flex-direction: column; gap: 12px; }
    .dlg { width: 100%; max-width: 100%; flex: none; }
    .teacher img { max-width: 60vw; }
    .speaker .stage { flex-direction: row; align-items: flex-start; gap: 10px; }
    .speaker .teacher img { height: 92px; max-width: 28vw; }
    .speaker .teacher img.framed { width: 84px; height: 84px; }
    .speaker .dlg { flex: 1; width: auto; min-width: 0; }
    .speaker .dlg-name { justify-content: flex-start; font-size: 20px; -webkit-text-stroke-width: 5px; margin-bottom: 4px; }
    .speaker .dlg-name img { width: 26px; height: 26px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .teacher.bob img, .pop { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>

<main class="frame">

  <!-- ===== MAIN MENU ===== -->
  <section class="screen active" id="screen-menu" aria-label="Menu utama">
    <h1 class="title" aria-label="Dandy's World Education">
      <img class="logo" src="logo.png" alt="" aria-hidden="true">
      <svg class="edu" viewBox="0 0 560 140" aria-hidden="true">
        <defs>
          <pattern id="chk" width="30" height="30" patternUnits="userSpaceOnUse">
            <rect width="30" height="30" fill="#86cf9f"/>
            <rect width="15" height="15" fill="#9fdbbb"/>
            <rect x="15" y="15" width="15" height="15" fill="#9fdbbb"/>
          </pattern>
        </defs>
        <g font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" font-size="88" text-anchor="middle" stroke-linejoin="round">
          <text x="280" y="110" textLength="500" lengthAdjust="spacingAndGlyphs" fill="#111" stroke="#111" stroke-width="22">EDUCATION</text>
          <text x="280" y="102" textLength="500" lengthAdjust="spacingAndGlyphs" fill="url(#chk)" stroke="#111" stroke-width="14" paint-order="stroke fill">EDUCATION</text>
        </g>
      </svg>
    </h1>

    <div class="stage">
      <div class="teacher bob" id="mTeacher"><img id="mImg" alt=""></div>
      <div class="dlg" id="mDlg" data-char="vee">
        <div class="dlg-name"><span id="mName"></span><img id="mIcon" alt=""></div>
        <div class="dbox" id="mBox"><p id="mText" aria-live="polite"></p></div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-icon" id="btnSettings" aria-label="Pengaturan">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1c1c3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M10.3 2.5h3.4l.5 2.4 1.9.8 2.1-1.3 2.4 2.4-1.3 2.1.8 1.9 2.4.5v3.4l-2.4.5-.8 1.9 1.3 2.1-2.4 2.4-2.1-1.3-1.9.8-.5 2.4h-3.4l-.5-2.4-1.9-.8-2.1 1.3-2.4-2.4 1.3-2.1-.8-1.9-2.4-.5v-3.4l2.4-.5.8-1.9-1.3-2.1 2.4-2.4 2.1 1.3 1.9-.8z"/>
        </svg>
      </button>

      <button class="btn-start" id="btnStart">Start</button>

      <div class="char-col">
        <div class="char-badge" id="badge"><img id="badgeImg" alt=""></div>
        <button class="btn-icon" id="btnChar">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1c1c3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
            <path d="M12 6.5a2.2 2.2 0 1 1 2.2-2.2"/>
            <path d="M12 6.5v2.3L3.5 15.2a1.6 1.6 0 0 0 1 2.9h15a1.6 1.6 0 0 0 1-2.9L12 8.8"/>
          </svg>
        </button>
      </div>
    </div>
  </section>

  <!-- ===== LAYAR SOAL ===== -->
  <section class="screen" id="screen-quiz" aria-label="Soal">
    <div class="qhead" id="qHead" hidden>
      <span class="pill" id="qNum">Soal 1 / 10</span>
      <button class="btn-small btn-menu" id="btnQuit">Menu</button>
    </div>

    <div class="qbox" id="qBox" hidden></div>
    <div class="opts" id="qOpts" hidden></div>

    <div class="speaker" id="qSpeaker" hidden>
      <div class="stage">
        <div class="teacher bob" id="qTeacher"><img id="qImg" alt=""></div>
        <div class="dlg compact" id="qDlg" data-char="vee">
          <div class="dlg-name"><span id="qName"></span><img id="qIcon" alt=""></div>
          <div class="dbox" id="qDbox"><p id="qText" aria-live="polite"></p></div>
        </div>
      </div>
    </div>

    <div class="qactions" id="qActions" hidden>
      <div class="namerow" id="nameRow" hidden>
        <input id="nameInput" type="text" maxlength="8" autocomplete="off" autocapitalize="words" spellcheck="false"
               placeholder="Nama (maks. 8 huruf)" aria-label="Nama kamu, maksimal 8 huruf">
      </div>
      <button class="btn-start" id="btnNext">Mengerti!</button>
    </div>
  </section>

  <!-- ===== LAYAR HASIL ===== -->
  <section class="screen" id="screen-result" aria-label="Hasil">
    <div class="result">
      <h2>Selesai!</h2>
      <p id="resultLabel">Total poin kamu</p>
      <div class="big" id="finalPoints">0</div>
      <p id="resultNote"></p>
      <button class="btn-start" id="btnHome">Ke menu</button>
    </div>
  </section>

</main>

<!-- ===== MODAL SETTING ===== -->
<div class="overlay" id="modalSettings" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="modal">
    <h2 id="setTitle">Pengaturan</h2>
    <div class="row"><span>Musik</span>
      <button class="toggle" id="tgMusic" role="switch" aria-checked="true" aria-label="Musik"></button></div>
    <div class="row"><span>Suara dialog &amp; tombol</span>
      <button class="toggle" id="tgSound" role="switch" aria-checked="true" aria-label="Suara dialog dan tombol"></button></div>
    <div class="row"><span>Animasi karakter</span>
      <button class="toggle" id="tgAnim" role="switch" aria-checked="true" aria-label="Animasi karakter"></button></div>
    <div class="close-row"><button class="btn-small" data-close>Selesai</button></div>
  </div>
</div>

<audio id="bgm" src="music.mp3" loop preload="auto"></audio>

<script>
/* ================= DATA KARAKTER =================
   text  = dialog di menu
   intro = dialog saat tekan Start
   icon  = gambar kecil di atas tombol gantungan baju */
const TEACHERS = [
  {
    id: "vee", name: "Vee", img: "vee.png", icon: "vee_icon.jpg", iconCover: true, sfx: "vee_chat.mp3",
    text: "Hallo aku Vee, aku akan mengarahkan mu cara menjawab soal disini",
    intro: "Apakah kamu siap untuk melihat berbagai pertanyaan? Caranya mudah, kamu tinggal memilih pilihan yang menurutmu paling benar dan total ada 4 yaitu A, B, C, dan D. Semoga beruntung!"
  },
  {
    id: "shelly", name: "Shelly", img: "shelly.png", icon: "shelly_icon.jpg", iconCover: false, sfx: "shelly_talking.mp3",
    text: "Hallo aku Shelly, kalau mau aku bisa mengajari mu soal fosil",
    intro: "Hah, mau mulai sekarang? Baiklah, caranya mudah. Kamu tinggal membaca soal yang bakalan ada di layar, lalu memilih jawaban A, B, C, atau D. Pilih pilihan yang paling tepat, jangan sampai salah!"
  }
];
const SHOWTIME = { id: "showtime", name: "Showtime", img: "showtime.jpg", sfx: null, framed: true };

/* ================= DATA SOAL =================
   answer = nomor jawaban benar (0=A, 1=B, 2=C, 3=D), -1 kalau belum ada
   hint   = dialog karakter setelah pilihan A-D muncul
   showtime = dialog Showtime sebelum soal ini muncul
   Tambah soal baru: salin satu blok lalu isi. */
const TOTAL_SOAL = 10;
const POINT = 10;
const NAME_MAX = 8;
const QUESTIONS = [
  {
    text: "Siapa nama karakter yang dimana berkepala TV?",
    options: ["Glisten", "Vee", "Rodger", "Tidak ada"],
    answer: 1,
    hint: {
      vee: "Hmmmm dimana yah? Apakah kamu tau siapa dia? Kurasa dia adalah seorang wanita yang menawan",
      shelly: "Televisi? Hmmmm mungkin aku pernah melihatnya, dan dia berwarna hijau kurasa"
    }
  },
  {
    /* pre = percakapan sebelum soal muncul, urut dari atas ke bawah.
       who: "showtime" atau "teacher" (karakter yang dipilih). {name} = nama pemain.
       ask: "name" = pemain mengetik nama (maks. 8 huruf). */
    pre: [
      { who: "showtime", ask: "name", button: "Kirim",
        text: "Ohh, lihat siapa yang mencoba mendapatkan nilai 100 hari ini. Bisa sebutkan namamu?" },
      { who: "showtime", button: "Lanjut",
        text: "Wow hahah, halo {name}! Kurasa kamu sudah tidak sabar untuk soal kedua. Terima kasih sudah memperkenalkan diri." },
      { who: "teacher", button: "Lanjut",
        text: {
          shelly: "Orang yang cukup unik, gak tau kenapa aku merasa dia mencuri koleksi tulangku",
          vee: "Orang yang sungguh aneh, dia kira gak ada yang sadar kalau dia menyembunyikan sesuatu?"
        } }
    ],
    text: "Toon yang dimana dapat menghasilkan cahaya",
    options: ["Rodger", "Toodles", "Soulvester", "Boxten"],
    answer: 2,
    hint: {
      shelly: "Bercahaya? Aku sama sekali tidak tau karena aku gak pernah mengalami mati lampu",
      vee: "Hmmmmmmmmmmmmmmmmmmmmmmm? Aku tidak akan membantu mu karena memang begitu hahah"
    }
  },
  {
    text: "Ada berapa total toon di Dandy's World?",
    options: ["38", "41", "40", "50"],
    answer: 2,
    hint: {
      shelly: "Jumlah toon, uhhh 1, 2, 3, 4.... Aku gak bisa berhitung, tapi kalau menghitung jumlah bagian Triceratops aku bisa",
      vee: "Jumlah toon? Seingatku minimal lebih dari 1, apakah itu membantu?"
    }
  }
];

/* ================= PENYIMPANAN ================= */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let state = {
  teacher: store.get("dwe_teacher", TEACHERS[0].id),
  music: store.get("dwe_music", true),
  sound: store.get("dwe_sound", true),
  anim: store.get("dwe_anim", true)
};
if (!TEACHERS.find(t => t.id === state.teacher)) state.teacher = TEACHERS[0].id;

const $ = id => document.getElementById(id);
const idx = () => TEACHERS.findIndex(t => t.id === state.teacher);
const current = () => TEACHERS[idx()];
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ================= SUARA ================= */
const sfx = {};
TEACHERS.forEach(t => { const a = new Audio(t.sfx); a.preload = "auto"; sfx[t.id] = a; });

const bgm = $("bgm");
bgm.volume = 0.35;
function playMusic() {
  if (!state.music) return;
  const p = bgm.play();
  if (p && p.catch) p.catch(() => {});
}
function syncMusic() { state.music ? playMusic() : bgm.pause(); }

let pendingDialogSound = null;
function playSpeakerSound(sp) {
  if (!state.sound || !sp.sfx) return;
  Object.values(sfx).forEach(a => { a.pause(); a.currentTime = 0; });
  const p = sfx[sp.id].play();
  if (p && p.catch) p.catch(() => { pendingDialogSound = sp; });
}

let audioCtx;
function beep(freq = 520, dur = 0.08) {
  if (!state.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.05, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

function firstGesture(e) {
  document.removeEventListener("pointerdown", firstGesture);
  document.removeEventListener("keydown", firstGesture);
  playMusic();
  if (pendingDialogSound && !(e.target.closest && e.target.closest("#btnStart,#btnChar"))) {
    const sp = pendingDialogSound; pendingDialogSound = null;
    playSpeakerSound(sp);
  }
}
document.addEventListener("pointerdown", firstGesture);
document.addEventListener("keydown", firstGesture);

/* ================= DIALOG =================
   p = awalan id elemen: "m" (menu) atau "q" (layar soal) */
let typeTimer;
function speak(sp, text, p) {
  const dlg = $(p + "Dlg");
  dlg.dataset.char = sp.id;
  $(p + "Name").textContent = sp.name;
  $(p + "Icon").src = sp.img;
  const img = $(p + "Img");
  img.src = sp.img; img.alt = sp.name;
  img.classList.toggle("framed", !!sp.framed);

  const box = $(p === "m" ? "mBox" : "qDbox");
  box.classList.remove("pop"); void box.offsetWidth;
  if (state.anim) box.classList.add("pop");

  playSpeakerSound(sp);

  clearInterval(typeTimer);
  const el = $(p + "Text");
  el.textContent = "";
  const len = text.length;
  let step = 28;
  if (sp.sfx) {
    const d = sfx[sp.id].duration;
    const dur = (d && isFinite(d)) ? d * 1000 : 1200;
    step = Math.max(22, Math.min(55, dur / len));
  }
  let i = 0;
  typeTimer = setInterval(() => {
    el.textContent = text.slice(0, ++i);
    if (i >= len) clearInterval(typeTimer);
  }, step);
}

/* ================= TAMPILAN MENU ================= */
function renderTeacher() {
  const t = current();
  const other = TEACHERS[(idx() + 1) % TEACHERS.length];
  $("badgeImg").src = t.icon;
  $("badgeImg").alt = "Karakter sekarang: " + t.name;
  $("badge").classList.toggle("cover", !!t.iconCover);
  $("btnChar").setAttribute("aria-label", "Ganti karakter ke " + other.name);
  $("btnChar").title = "Ganti ke " + other.name;
  $("mTeacher").classList.toggle("bob", state.anim);
  $("qTeacher").classList.toggle("bob", state.anim);
}
function menuDialog() { speak(current(), current().text, "m"); }

$("btnChar").addEventListener("click", () => {
  state.teacher = TEACHERS[(idx() + 1) % TEACHERS.length].id;
  store.set("dwe_teacher", state.teacher);
  renderTeacher();
  menuDialog();
  const b = $("badge");
  b.classList.remove("pop"); void b.offsetWidth; if (state.anim) b.classList.add("pop");
});

/* ================= MODAL SETTING ================= */
function openModal(el) { el.classList.add("open"); const b = el.querySelector("button"); b && b.focus(); }
function closeModals() { document.querySelectorAll(".overlay.open").forEach(o => o.classList.remove("open")); }
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => { beep(420); closeModals(); }));
document.querySelectorAll(".overlay").forEach(o => o.addEventListener("click", e => { if (e.target === o) closeModals(); }));
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModals(); });
$("btnSettings").addEventListener("click", () => { beep(480); openModal($("modalSettings")); });

function bindToggle(id, key, after) {
  const b = $(id);
  b.setAttribute("aria-checked", state[key]);
  b.addEventListener("click", () => {
    state[key] = !state[key];
    b.setAttribute("aria-checked", state[key]);
    store.set("dwe_" + key, state[key]);
    if (after) after();
    beep(600);
  });
}
bindToggle("tgMusic", "music", syncMusic);
bindToggle("tgSound", "sound");
bindToggle("tgAnim", "anim", renderTeacher);

/* ================= ALUR KUIS ================= */
let flow = 0;          // dipakai untuk membatalkan alur lama kalau pemain keluar ke menu
let quiz = { i: 0, points: 0 };
let playerName = "";
let nextAction = null;

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
  document.body.classList.toggle("quiz", id !== "screen-menu");
}
function resetQuizUI() {
  ["qHead", "qBox", "qOpts", "qSpeaker", "qActions", "nameRow"].forEach(id => $(id).hidden = true);
}
function setAction(label, fn) {
  $("btnNext").textContent = label;
  nextAction = fn;
  $("qActions").hidden = false;
  const b = $("qActions");
  b.classList.remove("pop"); void b.offsetWidth; if (state.anim) b.classList.add("pop");
}

/* Tekan Start: karakter yang dipilih menjelaskan cara menjawab */
$("btnStart").addEventListener("click", () => {
  beep(800, 0.12);
  flow++;
  clearInterval(typeTimer);
  quiz = { i: 0, points: 0 };
  playerName = "";
  resetQuizUI();
  show("screen-quiz");
  $("qSpeaker").hidden = false;
  speak(current(), current().intro, "q");
  setAction("Mengerti!", () => nextQuestion(0));
});

$("btnNext").addEventListener("click", () => {
  beep(700, 0.1);
  if (nextAction) { const f = nextAction; nextAction = null; $("qActions").hidden = true; $("nameRow").hidden = true; f(); }
});

/* Sebelum soal tampil: kalau ada percakapan (pre), jalankan dulu satu per satu */
function nextQuestion(i) {
  const q = QUESTIONS[i];
  if (!q) return showResult();
  quiz.i = i;
  resetQuizUI();
  if (q.pre) runSteps(q.pre, 0, i);
  else renderQuestion(i);
}

function cleanName(v) { return Array.from(v.trim()).slice(0, NAME_MAX).join(""); }

function runSteps(steps, n, i) {
  if (n >= steps.length) return renderQuestion(i);
  const st = steps[n];
  resetQuizUI();
  const sp = st.who === "showtime" ? SHOWTIME : current();
  const raw = typeof st.text === "string" ? st.text : st.text[current().id];
  const txt = raw.split("{name}").join(playerName);
  $("qSpeaker").hidden = false;
  speak(sp, txt, "q");

  const btn = $("btnNext");
  if (st.ask === "name") {
    const input = $("nameInput");
    input.value = "";
    btn.disabled = true;
    setAction(st.button, () => {
      playerName = cleanName(input.value);
      btn.disabled = false;
      runSteps(steps, n + 1, i);
    });
    $("nameRow").hidden = false;
    setTimeout(() => { try { input.focus(); } catch (e) {} }, 400);
  } else {
    btn.disabled = false;
    setAction(st.button, () => runSteps(steps, n + 1, i));
  }
}
$("nameInput").addEventListener("input", e => {
  const v = cleanName(e.target.value);
  if (v !== e.target.value.trim() && Array.from(e.target.value).length > NAME_MAX) e.target.value = v;
  $("btnNext").disabled = v.length === 0;
});
$("nameInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !$("btnNext").disabled) $("btnNext").click();
});

/* Urutan: soal muncul dulu, lalu A B C D, lalu dialog karakter */
async function renderQuestion(i) {
  const tok = ++flow;
  const q = QUESTIONS[i];
  resetQuizUI();
  clearInterval(typeTimer);

  $("qNum").textContent = "Soal " + (i + 1) + " / " + TOTAL_SOAL;
  $("qHead").hidden = false;
  const box = $("qBox");
  box.textContent = q.text;
  box.hidden = false;
  box.classList.remove("pop"); void box.offsetWidth; if (state.anim) box.classList.add("pop");
  beep(560, 0.1);

  const opts = $("qOpts");
  opts.innerHTML = "";
  const letters = ["A", "B", "C", "D"];
  const btns = q.options.map((t, k) => {
    const b = document.createElement("button");
    b.className = "opt"; b.disabled = true;
    b.innerHTML = '<span class="ltr">' + letters[k] + '</span><span></span>';
    b.lastChild.textContent = t;
    b.addEventListener("click", () => pick(i, k, btns));
    opts.appendChild(b);
    return b;
  });
  opts.hidden = false;

  await sleep(700); if (tok !== flow) return;
  for (let k = 0; k < btns.length; k++) {
    btns[k].classList.add("show");
    beep(480 + k * 90, 0.07);
    await sleep(220); if (tok !== flow) return;
  }
  btns.forEach(b => b.disabled = false);

  const hint = q.hint && q.hint[current().id];
  if (hint) {
    await sleep(250); if (tok !== flow) return;
    $("qSpeaker").hidden = false;
    speak(current(), hint, "q");
  }
}

/* Pilih A/B/C/D: poin disimpan dulu, ditampilkan di akhir */
async function pick(i, k, btns) {
  const tok = flow;
  const q = QUESTIONS[i];
  btns.forEach(b => b.disabled = true);
  btns[k].classList.add("picked");
  beep(820, 0.1);
  if (k === q.answer) quiz.points += POINT;
  await sleep(700); if (tok !== flow) return;
  clearInterval(typeTimer);
  nextQuestion(i + 1);
}

function showResult() {
  resetQuizUI();
  $("finalPoints").textContent = quiz.points;
  $("resultLabel").textContent = playerName ? "Total poin " + playerName : "Total poin kamu";
  $("resultNote").textContent = QUESTIONS.length < TOTAL_SOAL
    ? "Soal " + (QUESTIONS.length + 1) + " sampai " + TOTAL_SOAL + " masih menyusul."
    : "Terima kasih sudah bermain!";
  show("screen-result");
}

function toMenu() {
  flow++;
  nextAction = null;
  clearInterval(typeTimer);
  resetQuizUI();
  show("screen-menu");
  menuDialog();
}
$("btnQuit").addEventListener("click", () => { beep(420); toMenu(); });
$("btnHome").addEventListener("click", () => { beep(420); toMenu(); });

/* ================= MULAI ================= */
renderTeacher();
menuDialog();
</script>
</body>
</html>
